name: Verify command-line docs

on:
  push:
    branches: [ci/verify-command-line-docs]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: precommit
      - name: Run official documentation hooks on the changed page
        run: |
          for hook in markdownlint typos vale-sync vale trailing-whitespace end-of-file-fixer mixed-line-ending; do
            pre-commit run "$hook" --files docs/en/qgc-dev-guide/command_line_options.md
          done
      - name: Check the documentation patch for whitespace errors
        run: git diff --check f2f1631964457513f2e9fbaa92da655ad2671bf4 475ba69702741542759d2955ead5722dac74bb23 -- docs/en/qgc-dev-guide/command_line_options.md
